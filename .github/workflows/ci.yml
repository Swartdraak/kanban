name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The build script is `tsc --noEmit && vite build`. This covers the
      # "typecheck" step (strict) and the "vite build" step in CI: one step
      # that performs both the strict type-check and the production bundle.
      - name: Typecheck and build
        run: npm run build

      - name: Unit tests
        run: npm test
